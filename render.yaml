# Render Blueprint — one free web service running the backend.
# Render auto-detects this file at the repo root; rootDir scopes it to backend/.
# On first deploy set the two `sync: false` secrets in the dashboard.
services:
  - type: web
    name: portfolio-chatbot
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # generation only — set this in the Render dashboard (never commit it)
      - key: GEMINI_API_KEY
        sync: false
      # Where visitor "contact me" messages POST. MUST be a real Formspree form
      # endpoint (https://formspree.io/f/<form-id>) — the legacy email-in-URL
      # form (formspree.io/<email>) is deprecated and returns 403. Form ids are
      # public (they ship in the site's client HTML), so it's fine to commit.
      # The form must be activated in Formspree (confirm the first submission's
      # email) before sends succeed.
      - key: FORMSPREE_ENDPOINT
        value: https://formspree.io/f/myeygrly
      # Generation model. The "-lite" tier is cheap but reasons poorly — it
      # misread the experience list (reported an old role as "latest") and
      # hallucinated personal facts. The full flash tier is far more reliable
      # for grounded Q&A; drop back to a lite/older id only if you hit quota.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Embeddings backend. "gemini" = Gemini Embedding API (no local model, so it
      # fits 512 MB where fastembed OOMs). Alternatives: fastembed | st | tfidf.
      - key: EMBEDDER
        value: gemini
      # Gemini embedding knobs (used only when EMBEDDER=gemini):
      #   dim 768 (MRL-truncated, re-normalized) keeps vectors small. gemini-
      #   embedding-2 returns one vector per request, so docs are embedded one
      #   text per call; free tier is 100 req/min, so we do 50 then wait 60s
      #   (PER_MIN/COOLDOWN) to stay well under the cap. Docs are disk-cached
      #   (backend/data/embcache, committed by crawl.yml) so this boots on a
      #   cache hit -- only per-question query embeds hit the API at runtime.
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBED_DIM
        value: "768"
      - key: GEMINI_EMBED_PER_MIN
        value: "50"
      - key: GEMINI_EMBED_COOLDOWN
        value: "60"
      # unused unless EMBEDDER=fastembed
      - key: FASTEMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      # Empty => no boot crawl: load the snapshot in backend/data/site, which CI
      # (.github/workflows/crawl.yml) crawls + commits on push and weekly. If no
      # snapshot exists yet (first deploy), the app crawls live once so it still
      # boots. Set this to "https://adityajain.me https://projects.adityajain.me"
      # to force a live crawl on every boot.
      - key: CRAWL_SITES
        value: ""
      - key: CORPUS_DIR
        value: /tmp/site
      # inprocess = ONE interpreter (fits Render's 512 MB free tier). "process"
      # spawns 3 interpreters (parent + blog + contact MCP children) and OOMs at
      # 512 MB. inprocess keeps the same agent/tools + semantic search; the MCP
      # clients just run in-process instead of as subprocesses.
      - key: MCP_TRANSPORT
        value: inprocess
      # tighten to your Pages/portfolio origins in production, e.g.
      # https://jackgriffin105.github.io,https://adityajn105.github.io
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.6"
